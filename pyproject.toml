[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "career-job-manager"
version = "0.6.0"
description = "Job and Code: JOB and COMPANY terminal applications"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "textual>=8.2.8,<9",
]

[project.urls]
Repository = "https://github.com/MrMittenCrab/job-and-code"

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4"]

[project.scripts]
job = "career_job_manager.cli:main"
company = "career_job_manager.cli:company_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
